name: Idempotent Mattermost Migration & Upgrade

on:
  push:
    branches: [ "migration" ]
  workflow_dispatch:

env:
  COMPOSE_FILE: docker-compose.prod.yml
  DB_MYSQL_ROOT_PASSWORD: ${{ secrets.DB_MYSQL_ROOT_PASSWORD }}
  DB_POSTGRES_PASSWORD: ${{ secrets.DB_POSTGRES_PASSWORD }}

jobs:
  migrate-and-deploy:
    runs-on: self-hosted
    defaults:
      run:
        shell: powershell

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1. Проверка идемпотентности: выполнялась ли миграция ранее?
      - name: Check Migration Status
        id: check_status
        run: |
          $flagFile = Join-Path $env:USERPROFILE ".mattermost_migration_completed"
          if (Test-Path $flagFile) {
            Write-Host "Database already migrated to PostgreSQL. Skipping data transfer."
            "already_migrated=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "Migration required."
            "already_migrated=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      # 2. Создание резервной копии MySQL перед началом работ
      - name: Backup Legacy MySQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          Write-Host "Creating timestamped backup of MySQL..."
          $backupName = "mattermost_mysql_backup_${{ github.run_id }}.sql"
          $running = docker ps --format "{{.Names}}" | Select-String -Pattern "^mattermost-mysql$"
          if ($running) {
            docker exec -e "MYSQL_PWD=$env:DB_MYSQL_ROOT_PASSWORD" mattermost-mysql mysqldump -u root mattermost | Out-File -FilePath $backupName -Encoding utf8
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Write-Host "Backup successfully saved as $backupName"
          } else {
            Write-Host "Error: Legacy MySQL container is not running!"
            exit 1
          }

      # 3. Поднятие контейнера PostgreSQL для приема данных
      - name: Start Target PostgreSQL
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          docker compose -f $env:COMPOSE_FILE up -d db-postgres
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Waiting for PostgreSQL to initialize..."
          $ready = $false
          for ($i = 0; $i -lt 30; $i++) {
            docker exec mattermost-postgres pg_isready -U postgres -d mattermost 2>$null | Out-Null
            if ($LASTEXITCODE -eq 0) {
              Write-Host "PostgreSQL is ready."
              $ready = $true
              break
            }
            Start-Sleep -Seconds 2
          }
          if (-not $ready) {
            Write-Host "PostgreSQL did not become ready in time."
            exit 1
          }

      # 4. Гетерогенная миграция данных с помощью pgloader
      - name: Run pgloader (With Schema Drop for Idempotency)
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          Write-Host "Migrating schema and data from MySQL to PostgreSQL..."
          docker run --rm --network=mattermost_network mattermost/mattermost-pgloader:latest pgloader `
            --with "include drop" `
            "mysql://root:$($env:DB_MYSQL_ROOT_PASSWORD)@mattermost-mysql/mattermost" `
            "postgresql://postgres:$($env:DB_POSTGRES_PASSWORD)@mattermost-postgres/mattermost"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 5. Установка маркерного флаг-файла успешной миграции
      - name: Mark Migration as Completed
        if: steps.check_status.outputs.already_migrated == 'false'
        run: |
          $flagFile = Join-Path $env:USERPROFILE ".mattermost_migration_completed"
          New-Item -ItemType File -Path $flagFile -Force | Out-Null

      # 6. Развертывание обновленного продакшн-стека
      - name: Deploy Upgraded Stack
        run: |
          Write-Host "Launching Upgraded Mattermost Stack..."
          $legacyContainers = docker ps -a --filter "label=com.docker.compose.project=legacy" -q
          if ($legacyContainers) {
            Write-Host "Stopping and removing legacy stack containers..."
            docker rm -f $legacyContainers
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          docker compose -f $env:COMPOSE_FILE up -d --remove-orphans
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Write-Host "Waiting for Mattermost to apply internal database updates..."
          Start-Sleep -Seconds 30

      # 7. Автоматическое тестирование работоспособности
      - name: Run Health Checks & Verify Data
        run: |
          Write-Host "Running Smoke Tests..."
          try {
            $resp = Invoke-WebRequest -Uri "http://localhost:8065/api/v4/system/ping" -UseBasicParsing -TimeoutSec 10
            if ($resp.StatusCode -eq 200) {
              Write-Host "Mattermost upgraded successfully and running on Postgres! Status: $($resp.StatusCode)"
              Write-Host $resp.Content
            } else {
              throw "Unexpected status code: $($resp.StatusCode)"
            }
          } catch {
            Write-Host "Application health check failed. Fetching logs..."
            docker compose -f $env:COMPOSE_FILE logs --tail=100
            exit 1
          }
